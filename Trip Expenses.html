<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trip Ledger">
<title>Trip Ledger</title>

<style>
  :root{
    --ink:#101820;
    --ink-soft:#48545e;
    --paper:#f6f4ef;
    --card:#ffffff;
    --line:#e2ded4;
    --accent:#1f6f5c;
    --accent-soft:#e4efec;
    --danger:#b3422f;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  .mono{font-family:"SF Mono", "Menlo", ui-monospace, monospace;}
  header{
    padding:22px 20px 16px;
    background:var(--ink);
    color:#fff;
    position:sticky;
    top:0;
    z-index:10;
  }
  header .eyebrow{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#9fb3ad;
    margin-bottom:4px;
  }
  header h1{
    margin:0;
    font-size:22px;
    font-weight:650;
    letter-spacing:-0.01em;
  }
  header .back{
    display:inline-flex;
    align-items:center;
    gap:6px;
    color:#cfe3dd;
    font-size:14px;
    margin-bottom:10px;
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
  }
  main{padding:16px 16px 90px;}
  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .empty .glyph{font-size:34px; margin-bottom:10px;}
  .empty p{margin:6px 0; font-size:14px; line-height:1.5;}
